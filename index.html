<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#090909,#171717,#090909);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}
.page{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:28px 16px 35px;
}
.header{text-align:center;margin-bottom:22px}
.badge{
    display:inline-block;
    padding:7px 14px;
    border:1px solid #333;
    border-radius:30px;
    color:#bbb;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
}
h1{
    margin:14px 0 7px;
    font-size:30px;
    text-align:center;
}
.subtitle{color:#999;font-size:14px}
.card{
    background:#151515;
    border:1px solid #292929;
    border-radius:18px;
    padding:12px;
    box-shadow:0 18px 45px rgba(0,0,0,.45);
}
.video-link{
    display:block;
    position:relative;
    overflow:hidden;
    border-radius:13px;
    background:#000;
    text-decoration:none;
}
.video-image{
    display:block;
    width:100%;
    height:auto;
    max-height:650px;
    object-fit:cover;
}
.shade{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.35));
}
.play{
    width:78px;
    height:78px;
    border-radius:50%;
    background:#e50914;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    box-shadow:0 8px 28px rgba(0,0,0,.5);
}
.watch{
    display:block;
    width:100%;
    margin-top:14px;
    padding:15px;
    border-radius:10px;
    background:#e50914;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    font-size:17px;
}
.watch:hover{background:#f51a25}
.status{
    margin:15px 0 0;
    text-align:center;
    color:#aaa;
    font-size:13px;
}
#countdown{color:#fff;font-weight:bold}
.features{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    margin-top:18px;
}
.feature{
    padding:9px 13px;
    border-radius:8px;
    background:#1d1d1d;
    border:1px solid #292929;
    color:#aaa;
    font-size:12px;
}
.footer{
    text-align:center;
    margin-top:25px;
    color:#666;
    font-size:12px;
}
@media(max-width:600px){
    .page{padding:18px 10px 25px}
    h1{font-size:24px}
    .card{padding:8px;border-radius:14px}
    .video-link{border-radius:10px}
    .play{width:62px;height:62px;font-size:24px}
}
</style>
</head>

<body>
<main class="page">

    <header class="header">
        <span class="badge">HD VIDEO</span>
        <h1>Watch Video</h1>
        <div class="subtitle">Tap the image or button below to continue</div>
    </header>

    <section class="card">

        <a class="video-link"
           href="https://auctionr.org/4/c959177206c6902f227d57c909825d9e"
           target="_blank"
           rel="noopener">

            <img class="video-image"
                 src="https://raw.githubusercontent.com/enjoytiimes/virallink/main/watch6.png"
                 alt="Watch Video">

            <div class="shade">
                <div class="play">▶</div>
            </div>

        </a>

        <a class="watch"
           href="https://auctionr.org/4/c959177206c6902f227d57c909825d9e"
           target="_blank"
           rel="noopener">
            ▶ WATCH VIDEO
        </a>

        <div class="status">
            Opening automatically in <span id="countdown">0.5</span> second
        </div>

    </section>

    <div class="features">
        <div class="feature">✓ HD Quality</div>
        <div class="feature">✓ Mobile Friendly</div>
        <div class="feature">✓ Fast Loading</div>
    </div>

    <footer class="footer">© 2026 Watch Video</footer>

</main>

<script>
const destination =
    "https://auctionr.org/4/c959177206c6902f227d57c909825d9e";

let seconds = 0.5;
const countdown = document.getElementById("countdown");

const timer = setInterval(function(){
    seconds--;
    countdown.textContent = seconds;

    if(seconds <= 0){
        clearInterval(timer);
        window.location.href = destination;
    }
}, 500);
</script>

</body>
